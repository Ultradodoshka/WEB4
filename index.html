<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 1: Basic HTML Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assignment 4</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="index.html">Part 1</a>
                <a class="nav-link" href="bootstrap.html">Part 2</a>
                <a class="nav-link" href="register.html">Part 3</a>
            </div>
        </div>
    </nav>
    <main class="main-wrapper">
        <div class="form-card">
            <h3 class="mb-2">Fill out the form</h3>
            <p class="text-muted small mb-4">Please, fill out the form for sending us you ultra super important message</p>

            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" required minlength="2" maxlength="50" placeholder="e.g. John Doe">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com">
                </div>

                <div class="mb-4">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" name="message" class="form-control" rows="4" required minlength="10" maxlength="300" placeholder="Write your message here (min 10 characters)..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Send Message</button>
            </form>
        </div>
    </main>

</body>
</html>
