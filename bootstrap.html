<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 2: Bootstrap Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assignment 4</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Part 1</a>
                <a class="nav-link active" href="bootstrap.html">Part 2</a>
                <a class="nav-link" href="register.html">Part 3</a>
            </div>
        </div>
    </nav>

    <main class="main-wrapper">
        <div class="form-card">
            <h3 class="mb-2">Fill up the form</h3>
            <p class="text-muted small mb-4">Please, fill out the form(but cooler)</p>

            <form>
                <div class="mb-3">
                    <label for="bs-name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="bs-name" name="fullname" placeholder="John Doe" required minlength="2">
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Name is required (at least 2 letters).</div>
                </div>

                <div class="mb-3">
                    <label for="bs-email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="bs-email" name="email" placeholder="name@example.com" required>
                    <div class="form-text">We'll never share your email with anyone else(Maybe)</div>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <div class="mb-4">
                    <label for="bs-message" class="form-label">Message</label>
                    <textarea class="form-control" id="bs-message" name="message" rows="4" placeholder="How can we help you?" required minlength="10"></textarea>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Please enter at least 10 characters.</div>
                </div>

                <button type="submit" class="btn btn-success w-100">Submit Inquiry</button>
            </form>
        </div>
    </main>

</body>
</html>
